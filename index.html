<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Sign Up</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="auth-container">

        <!-- ================= LOGIN ================= -->
        <div class="auth-form login-form">

            <h1>Log In</h1>

            <div class="form-card">

                <form>

                    <input
                        type="text"
                        placeholder="Username"
                        required
                    >

                    <input
                        type="password"
                        placeholder="Password"
                        required
                    >

                    <a href="#" class="forgot-password">
                        forgot password?
                    </a>

                    <button type="submit">
                        Log In
                    </button>

                    <p class="switch-text">
                        Don't have an account?
                        <a href="#" id="showSignup">Sign Up!</a>
                    </p>

                </form>

            </div>

        </div>


        <!-- ================= SIGN UP ================= -->
        <div class="auth-form signup-form">

            <h1>Sign Up</h1>

            <div class="form-card">

                <form>

                    <input
                        type="text"
                        placeholder="Username"
                        required
                    >

                    <input
                        type="password"
                        placeholder="Password"
                        required
                    >

                    <label class="agreement">
                        <input type="checkbox" required>
                        <span>I accept the user agreement.</span>
                    </label>

                    <button type="submit">
                        Sign Up
                    </button>

                    <p class="switch-text login-switch">
                        Already have an account?
                        <a href="#" id="showLogin">Log In</a>
                    </p>

                </form>

            </div>

        </div>

    </div>


</body>
</html>
